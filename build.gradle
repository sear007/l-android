// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    ext {
        kotlin_version = '1.4.32'
        dagger_version = '2.35.1'
        lifecycle_version = '2.2.0'
        retrofit_version = '2.9.0'
        moshi_version = "1.8.0"
        rxjava_version = '2.1.1'
        rxcalladapter_version = '2.9.0'
        reactivestreams_version = "1.1.1"
        nav_version = "1.0.0"
        room_version = "2.3.0"
        recyclerview_version = '1.2.0'
        kotlin_coroutines_version = "1.4.1"
        retrofit_coroutines_adapter_version = "0.9.2"
        material_version = "1.3.0"

//        env_type = "dev"
//        env_type = "stg_dev"
//        env_type = "stg_prod"
        env_type = "prod"
    }
    repositories {
        google()
        mavenCentral()
        
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.5.20"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.3.5"
        classpath 'com.google.gms:google-services:4.3.8'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.6.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://nexus.ltlabs.co/repository/maven-releases/'
            credentials {
                username "jmaven"
                password "P@ssW0rdm@v12"
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
